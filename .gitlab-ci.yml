# williampoynter-co-uk CI - ADR-0018 pull-based product image delivery. The
# manifest checks and the Kaniko build live here; the deploy path
# (verify-staging, promote, verify-prod, cdn-purge, probe-prod) is the
# porter-valley-infra template ci-templates/product-deploy.yml (PLAT-763),
# included below and parameterised by the variables this file sets. The
# three scripts it calls stay in ci/ (template header, "option i").
#
# Belt-and-braces loop guard (pvt-gitlab-ci-authoring rule 7): the Flux
# automation commit and the promote commit both carry [skip ci], which
# already prevents pipeline creation - this guard keeps that true even if
# a future edit drops the marker from either message. Push pipelines
# only: a schedule (the prod probe) runs on whatever the default branch's
# HEAD is, and after every deploy that HEAD IS the promote commit, so an
# unscoped guard silently blocked every scheduled run (2026-10-23, the
# first portervalley-tech probe-prod tick never created a pipeline).
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /automated image update/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /^promote:/'
      when: never
    - when: always

stages:
  - test
  - build
  - verify-staging
  - promote
  - verify-prod
  - purge

include:
  - project: porter-valley-tech/naming
    ref: main
    file: ci-templates/validate-manifests.yml
  # product-deploy (porter-valley-infra ci-templates/, PLAT-763): the
  # hands-off deploy shape every ADR-0018 site with a behaviour suite
  # shares. CA_CERT and VAULT_CLI_VERSION come from the template;
  # STAGING_URL, PROD_URL, BDD_SUITE_CMD, the .bdd install, VAULT_ROLE
  # (promote) and CDN_PURGE_PRODUCT (cdn-purge) are set here.
  - project: porter-valley-tech/porter-valley-infra
    ref: main
    file: ci-templates/product-deploy.yml

# No runner tags anywhere: product jobs run on the brocco-k8s-runner, never
# the infra shell pair (tier isolation is a security boundary). No kubectl,
# no KUBE_* context, no cluster credentials in any job (ADR-0018).

variables:
  # The hugo-resume theme is a submodule - without this the build context
  # arrives without layouts and Hugo emits a near-blank site.
  GIT_SUBMODULE_STRATEGY: recursive
  STAGING_URL: "https://williampoynter-co-uk.app.staging.psl.sheffield.exchange"
  PROD_URL: "https://williampoynter.co.uk"
  # This site installs with yarn, not bun (template header, BDD_SUITE_CMD).
  # --retry 2 for the same mid-rollout reason the template gives.
  BDD_SUITE_CMD: "npx cucumber-js --retry 2"

validate-manifests:
  stage: test
  variables:
    NAMING_SCHEMA_REF: main
    MANIFESTS_DIR: manifest
  before_script:
    - if ! command -v bash >/dev/null 2>&1; then apk add --no-cache bash; fi
    - if ! command -v curl >/dev/null 2>&1; then apk add --no-cache curl; fi
    - if ! command -v git  >/dev/null 2>&1; then apk add --no-cache git; fi
    - if [ ! -e /etc/ssl/certs/ca-certificates.crt ]; then apk add --no-cache ca-certificates; fi
    - >
      curl -fsSL -o /tmp/cue.tar.gz
      "https://github.com/cue-lang/cue/releases/download/${NAMING_CUE_VERSION}/cue_${NAMING_CUE_VERSION}_linux_amd64.tar.gz"
    - echo "${NAMING_CUE_SHA256}  /tmp/cue.tar.gz" | sha256sum -c -
    - mkdir -p "${CI_PROJECT_DIR}/.cue-bin"
    - tar -xzf /tmp/cue.tar.gz -C "${CI_PROJECT_DIR}/.cue-bin" cue
    - export PATH="${CI_PROJECT_DIR}/.cue-bin:${PATH}"
    - cue version
    # TLS trust comes from the runner environment (PLAT-466): the kube
    # runner exports GIT_SSL_CAINFO at the cluster trust bundle and the
    # shell runners carry the root in the OS store. No per-job CA.
    - rm -rf /tmp/naming
    - >
      git clone --depth 1 --branch "${NAMING_SCHEMA_REF}"
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${NAMING_SCHEMA_PROJECT}.git"
      /tmp/naming

publish-product-manifests:
  extends: .publish-product-manifests
  needs:
    - validate-manifests

# Pull-based deploy (ADR-0018) plus the PLAT-240 environment axis.
#
# build          - push an immutable, sortable image tag (master-<epoch>-<sha8>).
#                  Flux image automation deploys it to STAGING automatically via
#                  the williampoynter-co-uk-staging ImagePolicy marker on
#                  flux/deployment-staging.yaml. Prod is NOT touched: its image
#                  line carries no marker. The build is this repo's job; the
#                  template `needs:` it and reads TAG from build.env.
#
# The rest of the path comes from the product-deploy template (see the
# include above and its header for every job, rule and WHY):
#
# verify-staging - poll until the canonical staging FQDN serves THIS pipeline's
#                  tag (ci/verify-staging.sh; Dockerfile bakes it at
#                  /build-tag.txt), then run the behaviour suite (features/)
#                  against staging.
# promote        - automatic once verify-staging is green: ci/promote.sh writes
#                  the staging-proven tag into flux/deployment.yaml and pushes
#                  with [skip ci]. Prod advances only here. Kill switch: the CI
#                  variable PROMOTE_GATE=manual makes it (and cdn-purge) a
#                  manual gate again.
# verify-prod    - poll until the origin serves PROMOTED_TAG (ci/verify-prod.sh),
#                  then run the behaviour suite against production.
# cdn-purge      - automatic once verify-prod is green: empties the bunny.net
#                  pull zone (ADR-0043 Decision 6, PLAT-497) so the edge
#                  refetches the promoted build.
# probe-prod     - the same suite against production, from a pipeline
#                  schedule with PROBE=prod. A regression fails the pipeline.

build:
  stage: build
  # Kaniko: daemonless image builder. The gitlab-runner k8s executor has no
  # Docker daemon. One kaniko executor invocation per job - never two in one
  # container (kaniko state corruption; admin-dashboard pipelines 374/375).
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    # Sortable, immutable tag: master-<epoch>-<sha8>. The epoch makes tags
    # sort numerically so the staging ImagePolicy always picks the newest.
    # The "master-" prefix is a contract with the ImagePolicy filterTags
    # pattern in flux/image-automation.yaml, not a branch lookup.
    - export TAG="master-$(date +%s)-${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_TAG="$CI_REGISTRY_IMAGE:${TAG}"
    # Hand the tag to verify-staging / promote via dotenv.
    - echo "TAG=${TAG}" > build.env
    # CA trust + registry auth for kaniko - see ci/kaniko-login.sh.
    - sh ci/kaniko-login.sh
    - echo "Building and pushing $IMAGE_TAG"
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "BUILD_TAG=${TAG}"
      --destination "$IMAGE_TAG"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The suite runner (template `.bdd`) installs with yarn here: GitLab merges
# these keys over the template's, keeping its playwright image, whose tag
# matches the playwright pin in package.json. yarn is installed only when
# the image lacks it. pull-push, not the template's pull: no other job in
# this pipeline installs node_modules, so the suite jobs fill the cache.
.bdd:
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
    policy: pull-push
  before_script:
    - command -v yarn >/dev/null 2>&1 || npm install -g yarn@1.22.22
    - yarn install --frozen-lockfile

# Per-site values of the template's jobs (its header lists them). The
# Vault role is bound to this project and its protected refs; the purge
# product is the name infra's cdn-purge job resolves to the pull zone of
# williampoynter.co.uk (ADR-0043 Decision 6, PLAT-497).
promote:
  variables:
    VAULT_ROLE: "ci-williampoynter-co-uk-promote"
    # This job never builds the site, so skip the global recursive
    # submodule fetch of the hugo-resume theme.
    GIT_SUBMODULE_STRATEGY: none

cdn-purge:
  variables:
    CDN_PURGE_PRODUCT: williampoynter-co-uk
