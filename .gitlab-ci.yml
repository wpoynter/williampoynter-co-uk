# Belt-and-braces loop guard (pvt-gitlab-ci-authoring rule 7): the Flux
# automation commit and the promote commit both carry [skip ci], which
# already prevents pipeline creation - this guard keeps that true even if
# a future edit drops [skip ci] from either message.
workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /automated image update/'
      when: never
    - if: '$CI_COMMIT_MESSAGE =~ /^promote:/'
      when: never
    - when: always

stages:
  - build
  - verify-staging
  - promote

# Pull-based deploy (ADR-0018) plus the PLAT-240 environment axis.
#
# build          - push an immutable, sortable image tag (master-<epoch>-<sha8>).
#                  Flux image automation deploys it to STAGING automatically via
#                  the williampoynter-co-uk-staging ImagePolicy marker on
#                  flux/deployment-staging.yaml. Prod is NOT touched: its image
#                  line carries no marker.
# verify-staging - poll until the canonical staging FQDN serves THIS pipeline's
#                  tag (Dockerfile bakes it at /build-tag.txt), then run the
#                  static-site checks.
# promote        - manual gate (ADR-0018 amendment 2026-07-11). Writes the
#                  staging-proven tag into flux/deployment.yaml as plain text
#                  and pushes with [skip ci] - the promote commit triggers NO
#                  pipeline. Prod advances only here.
#
# No kubectl, no KUBE_* context, no cluster credentials in any job (ADR-0018).
# No runner tags: product jobs run on the brocco-k8s-runner, never the infra
# shell pair (tier isolation is a security boundary).
#
# Each job's non-trivial logic lives in a named, single-purpose script under
# ci/ (kaniko-login.sh, verify-staging.sh, promote.sh) instead of inline
# heredoc bash - keeps this file to labelled setup/call steps and makes the
# logic readable, shellcheck-able, and testable on its own. This is a
# within-repo tidy, not a new shared platform mechanism: no cross-repo
# template or custom CI image was introduced here (deliberately - the team
# isn't generalising the ADR-0018 pattern across repos yet, see
# feedback_no_premature_generalization).

variables:
  # The hugo-resume theme is a submodule - without this the build context
  # arrives without layouts and Hugo emits a near-blank site.
  GIT_SUBMODULE_STRATEGY: recursive
  STAGING_URL: "https://williampoynter-co-uk.app.staging.psl.sheffield.exchange"
  # Porter Valley root CA, mounted into every k8s-runner job pod by the
  # gitlab-runner HelmRelease. Same root that signs the vault-pki cert on the
  # staging FQDN.
  CA_CERT: "/etc/ssl/certs/porter-valley-root-ca.crt"
  VAULT_CLI_VERSION: "1.18.1"

build:
  stage: build
  # Kaniko: daemonless image builder. The gitlab-runner k8s executor has no
  # Docker daemon. One kaniko executor invocation per job - never two in one
  # container (kaniko state corruption; admin-dashboard pipelines 374/375).
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    # Sortable, immutable tag: master-<epoch>-<sha8>. The epoch makes tags
    # sort numerically so the staging ImagePolicy always picks the newest.
    - export TAG="master-$(date +%s)-${CI_COMMIT_SHORT_SHA}"
    - export IMAGE_TAG="$CI_REGISTRY_IMAGE:${TAG}"
    # Hand the tag to verify-staging / promote via dotenv.
    - echo "TAG=${TAG}" > build.env
    # CA trust + registry auth for kaniko - see ci/kaniko-login.sh.
    - sh ci/kaniko-login.sh
    - echo "Building and pushing $IMAGE_TAG"
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "BUILD_TAG=${TAG}"
      --destination "$IMAGE_TAG"
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'

verify-staging:
  stage: verify-staging
  needs: ["build"]
  image: alpine:3.20
  timeout: 40m
  script:
    - apk add --no-cache curl
    # Poll for the canonical staging FQDN to serve THIS pipeline's tag, then
    # run the static-site checks - see ci/verify-staging.sh.
    - sh ci/verify-staging.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'

promote:
  stage: promote
  # Promotion is an explicit action (ADR-0018 amendment): when manual, set
  # INSIDE the rule - GitLab rejects a job-level `when:` combined with
  # `rules:` (pipeline fails at creation with zero jobs; learned on
  # pipeline 411). allow_failure: false keeps the pipeline 'blocked'
  # rather than 'passed' until promotion runs - an unpromoted build is
  # visibly unfinished. Skipping promotion for a given build is fine; the
  # next promotion supersedes it.
  needs: ["build", "verify-staging"]
  image: alpine:3.20
  timeout: 15m
  # Vault JWT auth - mirrors porter-valley-infra .gitlab/ci/templates.yml
  # .vault-jwt-auth (no shared include mechanism exists for product repos;
  # do NOT copy the networks repo's incompatible variant). aud must match
  # bound_audiences on the Vault role and is deliberately NOT VAULT_ADDR.
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.svc.internal
  variables:
    VAULT_ROLE: "ci-williampoynter-co-uk-promote"
    # Was `none`: the old inline script never touched the local checkout (it
    # did its own explicit git clone into /tmp/promote). Now that the job's
    # logic lives in ci/promote.sh, the runner needs a real checkout to find
    # that file at all - `fetch` is the smallest strategy that still does one.
    GIT_STRATEGY: fetch
    # This job doesn't need the hugo-resume theme (it never builds the
    # site), so skip the global recursive submodule fetch.
    GIT_SUBMODULE_STRATEGY: none
  script:
    - apk add --no-cache curl unzip ca-certificates git
    # Vault auth, staging health check, and the prod tag write + [skip ci]
    # commit-back all live in ci/promote.sh.
    - sh ci/promote.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: false
