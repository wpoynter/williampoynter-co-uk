
{{ $destination := .Permalink }}
{{ with .Params.link }}{{ $destination = . }}{{ end }}
<div class="resume-item d-flex flex-column flex-md-row mb-5">
  <div class="publication-content mr-auto">
    <h3 class="mb-0">{{ .Params.pubtype }} - <a href="{{ $destination }}"{{ if .Params.link }} rel="noopener noreferrer" data-umami-event="publication_outbound_click" data-umami-event-publication="{{ .Params.title }}"{{ end }}>{{ .Params.title }}</a></h3>
    <div>{{ .Params.description | safeHTML }}</div>
    {{ partial "techtags" . }}
  </div>
  <div class="resume-date text-md-right">
    <span class="text-primary">{{ .Params.date | dateFormat "January 2006" }}</span>
    {{ with .Params.image }}<img src="{{ . }}" class="publication-summary-image" alt="{{ $.Params.alt }}" width="250" height="145" loading="lazy" decoding="async">{{ end }}
  </div>
</div>
