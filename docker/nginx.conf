server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Location on redirects (/foo -> /foo/). nginx listens on 8080
    # behind the edge and plain HTTP behind TLS termination, so an absolute
    # redirect sent visitors to http://<host>:8080/foo/, which nothing
    # answers: every slashless link, including the theme's tag links, was
    # broken on staging and prod (features/routing.feature catches it).
    absolute_redirect off;

    # Hugo emits clean URLs as /foo/index.html - this serves them
    # whether the request is /foo, /foo/, or /foo/index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long cache for fingerprintable / immutable static assets.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Short cache for HTML / search index - these change on every deploy.
    location ~* \.(?:html|json|xml)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 404 /404.html;

    # /healthz for the kubelet probes; cheap and bypasses the regex map.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Don't leak nginx version.
    server_tokens off;
}
