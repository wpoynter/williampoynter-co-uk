# Internal staging host. williampoynter.sheffield.exchange has internal-
# only DNS (split-horizon) so Let's Encrypt HTTP01 can't validate; use
# the in-cluster Vault PKI issuer (chains up to the step-ca root that's
# already in browsers for the PVT team).
#
# Public cutover (2026-07-17): williampoynter.co.uk arrives via the
# Pangolin WG edge (site brocco-1 -> wg-1 DNAT -> this Traefik VIP), so
# the public route below needs NO in-cluster Certificate - Let's Encrypt
# terminates at the Pangolin edge, which does not verify upstream TLS.
# Traefik serves its default cert for the public SNIs; that is transport
# encryption on the internal leg only, by design.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: williampoynter-co-uk-tls
  namespace: williampoynter-co-uk
spec:
  secretName: williampoynter-co-uk-tls
  issuerRef:
    name: vault-pki
    kind: ClusterIssuer
  dnsNames:
    - williampoynter.sheffield.exchange
  duration: 2160h    # 90d
  renewBefore: 720h  # 30d
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: williampoynter-co-uk
  namespace: williampoynter-co-uk
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`williampoynter.sheffield.exchange`)
      kind: Rule
      services:
        - name: williampoynter-co-uk
          port: 8080
    # Public hostnames via the Pangolin edge (see header comment).
    # Canonical public host - serves content.
    - match: Host(`williampoynter.co.uk`)
      kind: Rule
      services:
        - name: williampoynter-co-uk
          port: 8080
    # www 308s to the apex (copies the-future-place/flux/ingress.yaml
    # pattern; same fix as flux/apps/newmr/ingress-redirect.yaml in
    # porter-valley-infra). Serving content on both hosts broke the
    # self-hosted fonts: Hugo bakes absolute apex asset URLs, so on www
    # the font loads were cross-origin and nginx sends no
    # Access-Control-Allow-Origin - browsers blocked all three fonts.
    # One canonical origin makes CORS moot and settles duplicate
    # content.
    # priority: the renderer-owned williampoynter-co-uk-canonical route
    # matches all three public hosts in one rule; Traefik's default
    # priority is rule length, so without an explicit priority that
    # route wins and the redirect never fires. 200 outranks any
    # rule-length default in play here.
    # Traefik requires a service on every route; the middleware fires
    # before it, so the service below is never reached.
    - match: Host(`www.williampoynter.co.uk`)
      kind: Rule
      priority: 200
      middlewares:
        - name: redirect-to-apex
      services:
        - name: williampoynter-co-uk
          port: 8080
  tls:
    secretName: williampoynter-co-uk-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-apex
  namespace: williampoynter-co-uk
spec:
  redirectRegex:
    regex: '^https?://www\.williampoynter\.co\.uk(?::\d+)?/(.*)'
    replacement: 'https://williampoynter.co.uk/${1}'
    permanent: true
