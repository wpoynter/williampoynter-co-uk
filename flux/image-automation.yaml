---
# Write-scoped git credential for the automation's commit-back. Pulls a
# write_repository deploy token from Vault (distinct from the read-only
# williampoynter-co-uk-git used by the reconcile source + registry pull). ca.crt
# so the source controller trusts vcs.sheffield.exchange over HTTPS.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flux-git-write
  namespace: williampoynter-co-uk
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: flux-git-write
    creationPolicy: Owner
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        ca.crt: |
          -----BEGIN CERTIFICATE-----
          MIIB5TCCAYqgAwIBAgIRAOuv3o+VwvQnB/fhSAFgY7swCgYIKoZIzj0EAwIwUDEi
          MCAGA1UEChMZUG9ydGVyIFZhbGxleSBJbnRlcm5hbCBDQTEqMCgGA1UEAxMhUG9y
          dGVyIFZhbGxleSBJbnRlcm5hbCBDQSBSb290IENBMB4XDTI2MDMyNTE3MTEwOFoX
          DTM2MDMyMjE3MTEwOFowUDEiMCAGA1UEChMZUG9ydGVyIFZhbGxleSBJbnRlcm5h
          bCBDQTEqMCgGA1UEAxMhUG9ydGVyIFZhbGxleSBJbnRlcm5hbCBDQSBSb290IENB
