  data:
    - secretKey: username
      remoteRef:
        key: secret/data/infrastructure/flux/williampoynter-co-uk-git-write
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/infrastructure/flux/williampoynter-co-uk-git-write
