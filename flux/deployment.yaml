apiVersion: apps/v1
kind: Deployment
metadata:
  name: williampoynter-co-uk
  namespace: williampoynter-co-uk
  labels:
    app: williampoynter-co-uk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: williampoynter-co-uk
      component: web
  template:
    metadata:
      labels:
        app: williampoynter-co-uk
        component: web
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: web
          image: registry.sheffield.exchange/porter-valley-tech/williampoynter-co-uk:master-1783145944-a6b83a6c # promotion-managed (PLAT-240): no $imagepolicy marker
          # PROD image line - promotion-managed (ADR-0018 amendment
          # 2026-07-11). Deliberately NO {"$imagepolicy": ...} marker: the
          # Setters strategy rewrites only marker-anchored lines, so the
          # ImageUpdateAutomation can never advance prod. The CI promote job
          # writes the staging-proven tag here as plain text and pushes with
          # [skip ci]. Rollback = git revert of a promote commit.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
