apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-credentials
  namespace: williampoynter-co-uk
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.sheffield.exchange":{"username":"{{ .username }}","password":"{{ .password }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/infrastructure/flux/williampoynter-co-uk-git
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/infrastructure/flux/williampoynter-co-uk-git
        property: password
