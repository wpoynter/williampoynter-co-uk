# AUTHORITATIVE product naming envelope. porter-valley-infra consumes this
# file through the Forge product catalog; do not hand-edit its generated mirror.
# Client+env form: <instance>.<type>.<env>.<client>.sheffield.exchange
# STAGING deploy target for the PSL client site (PLAT-240 env axis -
# williampoynter is the reference instance for staging -> prod promotion).
# Derived-exposure contract (ratified 2026-07-17): no `access` block and
# no `domains`, so this envelope derives exactly ONE SSO-protected
# Pangolin resource on its canonical FQDN (no vanity hosts, no public
# unprotected resource). vault-pki Certificate + internal A record via
# the generated zone companion. The backend Deployment/Service
# (williampoynter-co-uk-staging) live in this repo's flux/ dir.
instance: williampoynter-co-uk
type: app
env: staging
client: psl
binding:
  namespace: williampoynter-co-uk
  service: williampoynter-co-uk-staging
  port: 8080
fqdn: williampoynter-co-uk.app.staging.psl.sheffield.exchange
