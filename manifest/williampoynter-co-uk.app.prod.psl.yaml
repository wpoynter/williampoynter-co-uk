# AUTHORITATIVE product naming envelope. porter-valley-infra consumes this
# file through the Forge product catalog; do not hand-edit its generated mirror.
# The `domains` apex mints williampoynter.co.uk and www.williampoynter.co.uk
# as unprotected public resources - always public, orthogonal to `exposure`,
# which speaks only for the canonical name. The former www sibling envelope
# is retired: its host now derives from this envelope's `domains` entry.
instance: williampoynter-co-uk
type: app
env: prod
client: psl
# ADR-0038 D7: prod stays as it is today (this canonical publishes
# nothing) until the gated step-2 flip rules it. Vanity `domains` and
# `publicHosts`, where present, are unaffected - they are always public.
exposure: internal
fqdn: williampoynter-co-uk.app.prod.psl.sheffield.exchange
binding:
  namespace: williampoynter-co-uk
  service: williampoynter-co-uk
  port: 8080
cache:
  # Beta edge-cache canary: publish this manifest revision after the repaired
  # naming caller-attestation path, without changing the cache policy itself.
  policy: static
  ttl: 1h
domains:
  - williampoynter.co.uk
